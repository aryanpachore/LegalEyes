<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - BuddyLawyer</title>
  <link rel="stylesheet" href="style.css">
  <script src="navbar.js" defer></script>
</head>
<body>

  <custom-navbar></custom-navbar>

  <main class="auth-main">
    <div class="auth-container">
      <h2>Sign In to BuddyLawyer</h2>
      
      <form class="auth-form" action="#" method="POST">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
      
      <!-- ADDED DIVIDER AND GOOGLE BUTTON -->
      <div class="auth-divider">
        <span>OR</span>
      </div>
      
      <a href="#" class="btn-google">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.223,0-9.64-3.657-11.303-8H6.39l-0.12,0.118C9.47,36.512,16.14,44,24,44z"></path>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.089,5.591l0.001-0.001l6.19,5.238C36.961,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
        </svg>
        Continue with Google
      </a>
      <!-- END OF ADDED SECTION -->
      
      <p class="auth-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </div>
  </main>

</body>
</html>
